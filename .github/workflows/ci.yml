name: CI

# PR 에서 lint 와 build 를 돌린다.
#
# AGENTS.md 는 변경 후 npm run lint 를 실행하라고 적고 있지만, 사람이 잊으면
# 아무도 잡지 못한다. build 는 타입 검사까지 포함한다 — RouteContext 같은
# Next 생성 타입은 next build 를 거쳐야 검증된다.

on:
  pull_request:
    branches: [main, develop, release]
  push:
    branches: [main, develop]

jobs:
  lint-and-build:
    name: Lint + Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      # package-lock.json 을 그대로 쓴다. npm install 은 잠금 파일을 바꿀 수 있어
      # CI 가 검증한 의존성과 실제 배포본이 어긋날 수 있다.
      - name: 의존성 설치
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: 단위 테스트
        # 금액·날짜 표기와 응답 파싱은 화면 전체가 의존하는 계약이다.
        # 여기가 틀리면 모든 화면이 같은 방식으로 틀린다.
        run: npm test

      - name: Build
        run: npm run build

  image:
    name: Docker image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # 배포는 Jenkins 가 이 Dockerfile 로 이미지를 만들어 띄운다. 예전에는 Dockerfile 이
      # release 브랜치에만 있어 main 에서 아무도 빌드해보지 않았고, main 이 next.config.ts
      # 를 바꿀 때마다 배포 브랜치에서 충돌이 났다. 매 PR 마다 빌드하고 띄워본다.
      - name: Build image
        run: docker build -t burty-fe:ci .

      # compose 는 외부 네트워크(global-nginx)를 요구해 CI 에서 띄울 수 없다.
      # 설정이 해석되는지만 본다.
      - name: Validate compose file
        run: docker compose config --quiet

      # Jenkinsfile 과 같은 기준이다 — 컨테이너 healthcheck 가 healthy 가 될 때까지 기다린다.
      - name: Run and wait for healthy
        run: |
          docker run -d --name burty-fe-ci -p 3000:3000 burty-fe:ci
          status=starting
          for i in $(seq 1 36); do
            status=$(docker inspect -f '{{.State.Health.Status}}' burty-fe-ci)
            echo "[$i] health=$status"
            if [ "$status" = "healthy" ]; then break; fi
            if [ "$status" = "unhealthy" ]; then docker logs --tail 100 burty-fe-ci; exit 1; fi
            sleep 5
          done
          if [ "$status" != "healthy" ]; then
            echo "healthy 가 되지 않았다"
            docker logs --tail 100 burty-fe-ci
            exit 1
          fi
          curl -fsS -o /dev/null http://localhost:3000/
          curl -fsS -o /dev/null http://localhost:3000/manifest.webmanifest
