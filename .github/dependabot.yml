version: 2
updates:
  # 운영 의존성 취약점을 몰랐던 것은 이 설정이 없어서였다 (next critical 등 4건).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # 짝으로만 올라갈 수 있는 패키지는 한 PR 로 묶는다.
    #
    # 따로 올라오면 둘 다 실패한다 - Dependabot 이 package-lock 에서는 짝을 모두
    # 올리면서 package.json 에서는 하나만 올리므로 npm ci 가 불일치로 떨어진다.
    # react/react-dom 과 vitest/@vitest/coverage-v8 가 각각 그래서 막혀 있었다.
    groups:
      react:
        patterns:
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
      vitest:
        patterns:
          - vitest
          - "@vitest/*"
      # eslint-config-next 는 next 버전을 따라간다. 어긋나게 두지 않는다.
      next:
        patterns:
          - next
          - eslint-config-next
    # 메이저를 올려 봤다가 Lint + Build 가 깨져 되돌린 것들. 막지 않으면 매주 다시
    # 올라와 매번 같은 판단을 반복하게 된다.
    #
    # 막는 것은 메이저뿐이다 - 패치와 마이너는 그대로 받는다. 보안 패치까지 막으면
    # 이 설정이 취약점을 가리게 된다.
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 10
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # 베이스 이미지(node)의 CVE 패치를 받아온다.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
